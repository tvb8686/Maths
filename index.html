<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>數學</h1>
        </header>

        <div class="game-grid">
            <div class="game-card" style="--color: #ff4757;">
                <div class="image-box">
                    <img src="./images/plus.png" alt="Game 1">
                </div>
                <div class="content">
                    <h2>加法</h2>
                    <button onclick="openGame('plus')">立即开始</button>
                </div>
            </div>

            <div class="game-card" style="--color: #2ed573;">
                <div class="image-box">
                    <img src="./images/compare.png" alt="Game 2">
                </div>
                <div class="content">
                    <h2>數字比較大小</h2>
                    <button onclick="openGame('compare')">立即开始</button>
                </div>
            </div>

            <div class="game-card" style="--color: #1e90ff;">
                <div class="image-box">
                    <img src="./images/minus.png" alt="Game 3">
                </div>
                <div class="content">
                    <h2>減法</h2>
                    <button onclick="openGame('minus')">立即开始</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openGame(gameName) {
            //alert('正在启动: ' + gameName);
            // 这里可以跳转链接，例如 window.location.href = 'game_url.html';
            if (gameName == 'plus') {
                window.location.href = 'addition.html';
            } else if (gameName == 'minus') {
                window.location.href = 'minus.html';
            } else if (gameName == 'compare') {
                window.location.href = 'compare.html';
            }
        }
    </script>
</body>
</html>
