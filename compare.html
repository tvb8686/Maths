<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>數學大冒險</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: #fdf2f8; /* 柔和粉色系 */
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: none;
            overflow: hidden;
        }

                 /* --- Home Button 樣式 --- */
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-decoration: none; /* 如果是連結的話 */
        }

        .home-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
        }

        .container {
            background: #2a2f4c;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        /* 數字顯示區 */
        .game-display {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 50px;
        }

        .num-card {
            width: 120px; height: 120px;
            background: #f0f9ff;
            border-radius: 25px;
            font-size: 4rem;
            font-weight: bold;
            color: #0369a1;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 -5px 0 rgba(0,0,0,0.05);
        }

        .drop-zone {
            width: 100px; height: 100px;
            border: 4px dashed #cbd5e1;
            border-radius: 20px;
            font-size: 3.5rem;
            display: flex; align-items: center; justify-content: center;
            background: #fafafa;
        }

        /* 下方符號區 */
        .symbol-list {
            display: flex;
            gap: 20px;
            justify-content: center;
            height: 100px;
        }

        .drag-item {
            width: 85px; height: 85px;
            background: #4ade80;
            color: black;
            font-size: 3rem;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border-radius: 20px;
            cursor: pointer;
            position: relative;
            z-index: 10;
            user-select: none;
            box-shadow: 0 6px 0 #16a34a;
        }

        /* 拖動中的樣子 */
        .drag-item.active {
            scale: 1.1;
            opacity: 0.9;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        #msg { font-size: 1.8rem; font-weight: bold; margin-top: 30px; height: 1.5em; color: #16a34a; }
        .next-btn { 
            margin-top: 20px; padding: 15px 40px; background: #3b82f6; 
            color: white; border: none; border-radius: 15px; font-size: 1.2rem;
            display: none; cursor: pointer;
        }

        /* 手機適配 */
        @media (max-width: 500px) {
            .num-card { width: 80px; height: 80px; font-size: 2.5rem; }
            .drop-zone { width: 70px; height: 70px; font-size: 2.2rem; }
            .drag-item { width: 70px; height: 70px; font-size: 2.5rem; }
        }
    </style>
</head>

<div class="home-btn" onclick="goHome()">🏠</div>

<body>

    <h1 style="color: #be185d;">🐊 餵餵小鱷魚</h1>

    <div class="container">
        <div class="game-display">
            <div id="num1" class="num-card">?</div>
            <div id="slot" class="drop-zone"></div>
            <div id="num2" class="num-card">?</div>
        </div>

        <div class="symbol-list">
            <div class="drag-item" onpointerdown="onStart(event)">&lt;</div>
            <div class="drag-item" onpointerdown="onStart(event)">=</div>
            <div class="drag-item" onpointerdown="onStart(event)">&gt;</div>
        </div>

        <div id="msg"></div>
        <button id="next" class="next-btn" onclick="reset()">下一題 ➔</button>
    </div>

<script>
    // --- 音效系統 ---
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, t, d) {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(0.1, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + d);
        o.connect(g); g.connect(ctx.destination);
        o.start(); o.stop(ctx.currentTime + d);
    }
    const play = {
        pop: () => beep(600, 'sine', 0.1),
        win: () => { beep(523, 'sine', 0.2); setTimeout(()=>beep(659, 'sine', 0.2), 100); },
        no: () => beep(200, 'square', 0.2)
    };

    // --- 遊戲邏輯 ---
    let n1, n2, cur = null, startPos = {x:0, y:0};

    function reset() {
        n1 = Math.floor(Math.random()*100)+1;
        n2 = Math.floor(Math.random()*100)+1;
        document.getElementById('num1').innerText = n1;
        document.getElementById('num2').innerText = n2;
        document.getElementById('slot').innerText = '';
        document.getElementById('slot').style.background = '#fafafa';
        document.getElementById('msg').innerText = '';
        document.getElementById('next').style.display = 'none';
        document.querySelectorAll('.drag-item').forEach(i => {
            i.style.transform = 'translate(0,0)';
            i.style.display = 'flex';
        });
    }

    function onStart(e) {
        if (ctx.state === 'suspended') ctx.resume();
        cur = e.target;
        startPos = { x: e.clientX, y: e.clientY };
        cur.setPointerCapture(e.pointerId);
        cur.classList.add('active');
        cur.style.transition = 'none';
        play.pop();
    }

    window.onpointermove = (e) => {
        if (!cur) return;
        const dx = e.clientX - startPos.x;
        const dy = e.clientY - startPos.y;
        cur.style.transform = `translate(${dx}px, ${dy}px)`;
    };

    window.onpointerup = (e) => {
        if (!cur) return;
        cur.classList.remove('active');
        
        const slot = document.getElementById('slot').getBoundingClientRect();
        const me = cur.getBoundingClientRect();
        
        // 判定中心點碰撞
        const cx = me.left + me.width/2;
        const cy = me.top + me.height/2;

        if (cx > slot.left && cx < slot.right && cy > slot.top && cy < slot.bottom) {
            check(cur.innerText);
        } else {
            cur.style.transition = 'transform 0.3s cubic-bezier(0.5, 0, 0.5, 1.5)';
            cur.style.transform = 'translate(0,0)';
        }
        cur = null;
    };

    function check(val) {
        const correct = n1 > n2 ? '>' : (n1 < n2 ? '<' : '=');
        if (val === correct) {
            play.win();
            document.getElementById('slot').innerText = val;
            document.getElementById('slot').style.background = '#fef08a';
            document.getElementById('msg').innerText = '答對了！✨';
            document.getElementById('next').style.display = 'inline-block';
            document.querySelectorAll('.drag-item').forEach(i => i.style.display = 'none');
        } else {
            play.no();
            document.getElementById('msg').innerText = '再試試看 😋';
            cur.style.transition = 'transform 0.3s';
            cur.style.transform = 'translate(0,0)';
        }
    }

    function goHome() {
        // 你可以根據需要修改跳轉網址，例如 index.html
        window.location.href = "index.html"; 
    }

    reset();
</script>
</body>
</html>
